<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — BloxBet</title>
<link rel="icon" type="image/png" href="icons/bloxbet.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/redesign.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body bb-ui">

<div id="bbLoader" class="bb-loader">
  <div class="bb-loader-bg"></div>
  <div class="bb-loader-veil"></div>
  <div class="bb-loader-vignette"></div>
  <div class="bb-loader-glow"></div>
  <div class="bb-loader-inner">
    <div class="bb-loader-lockup">
      <div class="bb-loader-mark">
        <img src="icons/bloxbet.png" alt="BloxBet" draggable="false">
      </div>
      <div class="bb-loader-text">
        <span class="bb-blox">Blox</span><span class="bb-bet">Bet</span>
      </div>
    </div>
    <div class="bb-loader-bar">
      <div class="bb-loader-fill"></div>
    </div>
  </div>
</div>

<div class="auth-wrap">
  <a href="index.html" class="auth-brand" aria-label="BloxBet home">
    <img src="icons/bloxbet.png" alt="" class="auth-brand-mark" draggable="false">
    <span class="auth-brand-text">BloxBet</span>
  </a>

  <div class="auth-card">
    <h1 class="auth-title">Log in</h1>
    <p class="auth-sub">Enter your Roblox username to continue.</p>

    <form id="loginForm" autocomplete="username">
      <div class="auth-field">
        <label for="username">Roblox username</label>
        <div class="auth-input-wrap">
          <img src="icons/profile.png" alt="" class="ico" draggable="false">
          <input class="auth-input" id="username" name="username" type="text" maxlength="20" placeholder="e.g. Builderman" required autofocus>
        </div>
      </div>

      <div id="status" class="auth-status"></div>

      <button type="submit" class="auth-btn" id="loginBtn">
        <span>Continue</span>
        <img src="icons/chevron-right.png" alt="" class="ico" draggable="false">
      </button>
    </form>
  </div>

  <p class="auth-foot">
    By continuing you agree to our <a href="#" onclick="return false;">Terms</a> and <a href="#" onclick="return false;">Privacy Policy</a>.
  </p>
</div>


<script id="bb-loader-ctrl">
(function(){
  var path = (location.pathname || '').split('/').pop() || 'index.html';
  var forcePages = { 'leaderboard.html':1, 'profile.html':1 };
  var nav = false;
  try { nav = sessionStorage.getItem('bb_internal_nav') === '1'; } catch(e){}
  var show = forcePages[path] || !nav;
  // mark next navigations as internal
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(!a) return;
    var href = a.getAttribute('href') || '';
    if(!href || href.indexOf('http') === 0 || href.indexOf('//') === 0 || href.charAt(0) === '#' || a.target === '_blank') return;
    try { sessionStorage.setItem('bb_internal_nav', '1'); } catch(err){}
  }, true);
  // hard refresh clears performance navigation type
  try {
    var navEntry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if(navEntry && navEntry.type === 'reload'){ show = true; }
  } catch(e){}
  var loader = document.getElementById('bbLoader');
  if(!loader) return;
  if(!show){
    loader.classList.add('hide');
    try { loader.remove(); } catch(e){}
    return;
  }
  setTimeout(function(){
    loader.classList.add('hide');
    setTimeout(function(){ try{ loader.remove(); }catch(e){} }, 350);
  }, 320);
})();
</script>


<script src="js/auth.js"></script>
<script>
  (function(){
    if(typeof Auth === 'undefined'){ console.error('[login] Auth missing'); return; }
    if(Auth.isLoggedIn()){ Auth.safeRedirect('index'); return; }

    var form = document.getElementById('loginForm');
    var btn  = document.getElementById('loginBtn');
    var statusEl = document.getElementById('status');

    function showStatus(type, msg){
      var icons = { error:'alert', success:'check', info:'info' };
      statusEl.className = 'auth-status show ' + type;
      statusEl.innerHTML = '<img src="icons/' + (icons[type]||'info') + '.png" alt="" class="ico" draggable="false"><span>' + msg + '</span>';
    }
    function hideStatus(){ statusEl.className = 'auth-status'; }

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      hideStatus();

      var username = document.getElementById('username').value.trim();
      if(username.length < 3){
        showStatus('error', 'Username must be at least 3 characters.');
        return;
      }
      if(!/^[A-Za-z0-9_]+$/.test(username)){
        showStatus('error', 'Only letters, numbers, and underscores.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>Loading…</span>';

      try {
        var result = await Auth.startLogin(username);
        if(result && result.demo){
          await new Promise(function(r){ setTimeout(r, 300); });
        }
        location.href = '/verify.html';
      } catch (err) {
        showStatus('error', err.message || 'Something went wrong.');
        btn.disabled = false;
        btn.innerHTML = '<span>Continue</span><img src="icons/chevron-right.png" alt="" class="ico" draggable="false">';
      }
    });
  })();
</script>
</body>
</html>
