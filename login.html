<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign in — BloxBet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

<div id="bbLoader" class="bb-loader">
  <div class="bb-loader-bg"></div>
  <div class="bb-loader-veil"></div>
  <div class="bb-loader-vignette"></div>
  <div class="bb-loader-glow"></div>
  <div class="bb-loader-inner">
    <div class="bb-loader-lockup">
      <div class="bb-loader-mark">
        <img src="icons/bloxbet.png" alt="BloxBet" draggable="false">
      </div>
      <div class="bb-loader-text">
        <span class="bb-blox">Blox</span><span class="bb-bet">Bet</span>
      </div>
    </div>
    <div class="bb-loader-bar">
      <div class="bb-loader-fill"></div>
    </div>
  </div>
</div>

<div class="auth-wrap">
  <a href="index.html" class="auth-brand" aria-label="BloxBet home">
    <img src="icons/bloxbet.png" alt="" class="auth-brand-mark" draggable="false">
    <span class="auth-brand-text">BloxBet</span>
  </a>

  <div class="auth-card">
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" data-mode="login" role="tab" aria-selected="true">Log in</button>
      <button type="button" class="auth-tab" data-mode="signup" role="tab" aria-selected="false">Sign up</button>
    </div>

    <h1 class="auth-title" id="authTitle">Welcome back</h1>
    <p class="auth-sub" id="authSub">Enter your Roblox username to continue.</p>

    <form id="loginForm" autocomplete="username">
      <div class="auth-field">
        <label for="username">Roblox username</label>
        <div class="auth-input-wrap">
          <img src="icons/profile.png" alt="" class="ico" draggable="false">
          <input class="auth-input" id="username" name="username" type="text" maxlength="20" placeholder="e.g. Builderman" required autofocus>
        </div>
      </div>

      <div id="status" class="auth-status"></div>

      <button type="submit" class="auth-btn" id="loginBtn">
        <span id="loginBtnLabel">Continue</span>
        <img src="icons/chevron-right.png" alt="" class="ico" draggable="false">
      </button>
    </form>
  </div>

  <p class="auth-foot">
    By continuing you agree to our <a href="#" onclick="return false;">Terms</a> and <a href="#" onclick="return false;">Privacy Policy</a>.
  </p>
</div>

<script>
  (function(){
    var loader = document.getElementById('bbLoader');
    if(!loader) return;
    setTimeout(function(){
      loader.classList.add('hide');
      setTimeout(function(){ loader.remove(); }, 320);
    }, 2000);
  })();
</script>

<script src="js/auth.js"></script>
<script>
  (function(){
    if(typeof Auth === 'undefined'){ console.error('[login] Auth missing'); return; }
    if(Auth.isLoggedIn()){ Auth.safeRedirect('index'); return; }

    var form = document.getElementById('loginForm');
    var btn  = document.getElementById('loginBtn');
    var statusEl = document.getElementById('status');
    var titleEl = document.getElementById('authTitle');
    var subEl = document.getElementById('authSub');
    var btnLabel = document.getElementById('loginBtnLabel');
    var mode = 'login';

    var params = new URLSearchParams(location.search);
    if(params.get('mode') === 'signup') mode = 'signup';

    function applyMode(m){
      mode = m;
      document.querySelectorAll('.auth-tab').forEach(function(tab){
        var on = tab.getAttribute('data-mode') === mode;
        tab.classList.toggle('active', on);
        tab.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      if(mode === 'signup'){
        titleEl.textContent = 'Create your account';
        subEl.textContent = 'Enter your Roblox username to get started.';
        btnLabel.textContent = 'Create account';
        document.title = 'Sign up — BloxBet';
      } else {
        titleEl.textContent = 'Welcome back';
        subEl.textContent = 'Enter your Roblox username to continue.';
        btnLabel.textContent = 'Continue';
        document.title = 'Sign in — BloxBet';
      }
      try {
        var url = new URL(location.href);
        if(mode === 'signup') url.searchParams.set('mode', 'signup');
        else url.searchParams.delete('mode');
        history.replaceState(null, '', url.pathname + url.search);
      } catch(e){}
    }

    document.querySelectorAll('.auth-tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        applyMode(tab.getAttribute('data-mode'));
        hideStatus();
        document.getElementById('username').focus();
      });
    });
    applyMode(mode);

    function showStatus(type, msg){
      var icons = { error:'alert', success:'check', info:'info' };
      statusEl.className = 'auth-status show ' + type;
      statusEl.innerHTML = '<img src="icons/' + (icons[type]||'info') + '.png" alt="" class="ico" draggable="false"><span>' + msg + '</span>';
    }
    function hideStatus(){ statusEl.className = 'auth-status'; }

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      hideStatus();

      var username = document.getElementById('username').value.trim();
      if(username.length < 3){
        showStatus('error', 'Username must be at least 3 characters.');
        return;
      }
      if(!/^[A-Za-z0-9_]+$/.test(username)){
        showStatus('error', 'Only letters, numbers, and underscores.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>Loading…</span>';

      try {
        var result = await Auth.startLogin(username);
        if(result && result.demo){
          await new Promise(function(r){ setTimeout(r, 300); });
        }
        location.href = '/verify.html';
      } catch (err) {
        showStatus('error', err.message || 'Something went wrong.');
        btn.disabled = false;
        btn.innerHTML = '<span id="loginBtnLabel">' + (mode === 'signup' ? 'Create account' : 'Continue') + '</span><img src="icons/chevron-right.png" alt="" class="ico" draggable="false">';
        btnLabel = document.getElementById('loginBtnLabel');
      }
    });
  })();
</script>
</body>
</html>
