<style>
.ad-shell{max-width:1120px;margin:0 auto}
.ad-hero{
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;
  margin-bottom:1.25rem;padding:1.25rem 1.35rem;border-radius:var(--r-xl);
  border:1px solid var(--border);
  background:
    radial-gradient(ellipse 70% 80% at 0% 0%, rgba(255,149,0,.14), transparent 55%),
    var(--surface);
}
.ad-hero h1{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;margin:0 0 .25rem}
.ad-hero p{margin:0;font-size:.78rem;color:var(--text-3);max-width:36ch;line-height:1.45}
.ad-hero-actions{display:flex;gap:.45rem;flex-wrap:wrap}

.ad-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:.55rem;margin-bottom:1.15rem}
@media(max-width:960px){.ad-stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.ad-stats{grid-template-columns:repeat(2,1fr)}}
.ad-stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:.8rem .9rem;min-height:72px;
}
.ad-stat-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--text-3);margin-bottom:.35rem}
.ad-stat-value{font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:700;letter-spacing:-.02em}
.ad-stat-value.accent{color:var(--accent)}
.ad-stat-sub{font-size:.6rem;color:var(--text-3);margin-top:.2rem;font-family:'JetBrains Mono',monospace}

.ad-tabs{
  display:flex;gap:.2rem;padding:.3rem;background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--r-md);margin-bottom:1rem;flex-wrap:wrap;
}
.ad-tab{
  appearance:none;border:none;background:transparent;color:var(--text-3);
  font-family:inherit;font-size:.76rem;font-weight:600;padding:.5rem .85rem;
  border-radius:calc(var(--r-md) - 2px);cursor:pointer;
}
.ad-tab:hover{color:var(--text-2)}
.ad-tab.active{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}

.ad-panel{display:none}
.ad-panel.active{display:block}
.ad-note{font-size:.72rem;color:var(--text-3);margin:0 0 .85rem;line-height:1.45}

.ad-toolbar{display:flex;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap;align-items:center}
.ad-toolbar input,.ad-toolbar select{
  background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text);font-family:inherit;font-size:.78rem;padding:.5rem .7rem;outline:none;min-width:180px;
}
.ad-toolbar input:focus{border-color:var(--accent)}

.ad-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;
}
.ad-row{
  display:grid;gap:.75rem;align-items:center;padding:.6rem .95rem;
  border-bottom:1px solid var(--border);font-size:.74rem;
}
.ad-row:last-child{border-bottom:none}
.ad-row:hover{background:var(--surface-2)}
.ad-row.head{
  background:rgba(255,255,255,.02);color:var(--text-3);font-size:.62rem;
  text-transform:uppercase;letter-spacing:.05em;font-weight:600;
}
.ad-users .ad-row{grid-template-columns:36px minmax(100px,1.1fr) .7fr minmax(90px,.9fr) minmax(80px,.8fr) .6fr auto}
.ad-tx .ad-row{grid-template-columns:1.1fr .9fr .8fr .8fr .9fr}
.ad-logs .ad-row{grid-template-columns:1fr .9fr 1fr 1.5fr .8fr}
.ad-chat .ad-row{grid-template-columns:1fr 2.2fr auto auto}
.ad-live-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
@media(max-width:800px){
  .ad-live-grid{grid-template-columns:1fr}
  .ad-users .ad-row{grid-template-columns:36px 1fr auto}
  .ad-users .hide-sm{display:none}
}

.ad-avatar{
  width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--surface-3);
  display:grid;place-items:center;font-weight:600;font-size:.72rem;position:relative;flex-shrink:0;
}
.ad-avatar img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.ad-mono{font-family:'JetBrains Mono',monospace;font-size:.7rem}
.ad-badge{
  display:inline-flex;align-items:center;padding:.15rem .45rem;border-radius:999px;
  font-size:.62rem;font-weight:600;background:var(--surface-3);color:var(--text-2);
}
.ad-badge.admin{background:rgba(255,149,0,.15);color:var(--accent-2)}
.ad-badge.win{background:rgba(34,197,94,.12);color:#4ade80}
.ad-badge.lose{background:rgba(239,68,68,.12);color:#fca5a5}
.ad-actions{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.ad-empty{padding:2.25rem 1rem;text-align:center;color:var(--text-3);font-size:.78rem}
.ad-section-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:600;margin:0 0 .5rem;padding:0 .15rem}
.ad-pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:.35rem;box-shadow:0 0 0 0 rgba(74,222,128,.5);animation:adPulse 1.6s infinite}
@keyframes adPulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.45)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
</style>

        <button type="button" class="btn btn-ghost btn-sm" id="aapSet">Set</button>
        <button type="button" class="btn btn-ghost btn-sm" id="aapTempBan">Temp Ban</button>
        <button type="button" class="btn btn-ghost btn-sm" id="aapBan">Ban</button>
        <button type="button" class="btn btn-ghost btn-sm" id="aapUnban">Unban</button>
        <button type="button" class="btn btn-ghost btn-sm" id="aapAdmin">Toggle Admin</button>
        <button type="button" class="btn btn-ghost btn-sm" id="aapResetLb">Remove from Leaderboard</button>
      </div>
    </div>
  </div>
</div>

</main>

<script src="js/toasts.js"></script>
<script src="js/auth.js"></script>
<script src="js/icons.js"></script>
<script src="js/modals.js"></script>
<script>
(function(){
  if(typeof Auth === 'undefined'){ location.href = 'login.html'; return; }
  if(!Auth.isLoggedIn()){ Auth.safeRedirect('login'); return; }
  var me = Auth.getUser();
  if(!me || !me.isAdmin){
    if(window.Toast) Toast.error('Forbidden','Admin only');
    Auth.safeRedirect('index');
    return;
  }
  if(typeof renderAvatar === 'function') renderAvatar(document.getElementById('navAvatar'), me);

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function fmt(n){ return Number(n||0).toLocaleString(); }
  function ago(ts){
    if(!ts) return '—';
    var s = Math.floor((Date.now()-Number(ts))/1000);
    if(s<60) return s+'s';
    if(s<3600) return Math.floor(s/60)+'m';
    if(s<86400) return Math.floor(s/3600)+'h';
    return Math.floor(s/86400)+'d';
  }

  document.querySelectorAll('.av3-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.av3-tab').forEach(function(t){ t.classList.remove('active'); });
      document.querySelectorAll('.av3-panel').forEach(function(p){ p.classList.remove('active'); });
      tab.classList.add('active');
      var panel = document.getElementById('av3-' + tab.dataset.tab);
      if(panel) panel.classList.add('active');
      if(tab.dataset.tab === 'users') loadUsers(document.getElementById('userSearch').value.trim());
      if(tab.dataset.tab === 'chat') loadChat();
      if(tab.dataset.tab === 'logs') loadLogs();
    });
  });

  async function loadStats(){
    try {
      var res = await Auth.api('/admin/stats');
      if(!res.ok) return;
      var d = await res.json();
      var users = d.users || {};
      var eco = d.economy || {};
      var act = d.activity || {};
      document.getElementById('stUsers').textContent = fmt(users.total||0);
      document.getElementById('stActive').textContent = fmt(users.active24h||0);
      document.getElementById('stPool').textContent = fmt(eco.balancePool||eco.totalBalance||0);
      document.getElementById('stWager').textContent = fmt(act.wagered24h||eco.wagered24h||0);
    } catch(e){}
  }

  async function loadUsers(q){
    var el = document.getElementById('userTable');
    el.innerHTML = '<div class="av3-empty">Loading users…</div>';
    try {
      var res = await Auth.api('/admin/users?limit=200' + (q ? ('&q='+encodeURIComponent(q)) : ''));
      if(!res.ok){
        el.innerHTML = '<div class="av3-empty">Failed to load users ('+res.status+'). Check admin flag on server.</div>';
        return;
      }
      var d = await res.json();
      var users = d.users || [];
      if(!users.length){ el.innerHTML = '<div class="av3-empty">No users found</div>'; return; }
      el.innerHTML = '';
      var grid = document.createElement('div');
      grid.className = 'av3-grid';
      users.forEach(function(u){
        var name = u.displayName || u.username || '?';
        var letter = String(name).slice(0,1).toUpperCase();
        var avUrl = u.avatar || (u.id ? '/api/avatar/'+encodeURIComponent(u.id) : '');
        var card = document.createElement('div');
        card.className = 'av3-card' + (u.banned ? ' is-banned' : '');
        card.innerHTML =
          '<div class="av3-top">' +
            '<div>' + (avUrl ? '<img class="av3-av" src="'+esc(avUrl)+'" alt="" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : '<div class="av3-av-ph">'+esc(letter)+'</div>') + '</div>' +
            '<div><div class="av3-name">'+esc(name)+'</div><div class="av3-handle">@'+esc(u.username||'')+'</div>' +
            '<div class="av3-flags">' +
              (u.isAdmin?'<span class="av3-badge admin">Admin</span>':'<span class="av3-badge">User</span>') +
              (u.banned?'<span class="av3-badge ban">Banned</span>':(u.online?'<span class="av3-badge online">Online</span>':'<span class="av3-badge">Offline</span>')) +
            '</div></div>' +
            '<div class="av3-bal"><div class="lbl">RC / BC</div><div class="val">'+fmt(u.balance)+'</div><div class="lbl">'+fmt(u.bloxCoins||0)+' BC</div></div>' +
          '</div>' +
          '<div class="av3-actions">' +
            '<button type="button" class="btn btn-sm btn-primary" data-act="manage">Manage</button>' +
            '<button type="button" class="btn btn-sm btn-ghost" data-act="stats">Stats</button>' +
            (u.banned?'<button type="button" class="btn btn-sm btn-ghost" data-act="unban">Unban</button>':'') +
          '</div>';
        card.querySelectorAll('[data-act]').forEach(function(btn){
          btn.addEventListener('click', function(){
            var act = btn.getAttribute('data-act');
            if(act === 'manage'){ openUserPanel(u); return; }
            if(act === 'stats'){
              alert('Stats for @'+(u.username||'')+'\nRC: '+fmt(u.balance)+'\nBC: '+fmt(u.bloxCoins||0)+'\nWagered: '+fmt(u.totalWagered||0)+'\nGames: '+fmt(u.gamesPlayed||0)+'\nRank: '+(u.rank||'—')+'\nLevel: '+(u.level||1));
              return;
            }
            handleAct(act, u);
          });
        });
        grid.appendChild(card);
      });
      el.appendChild(grid);
    } catch(err){
      el.innerHTML = '<div class="av3-empty">Error loading users</div>';
      console.error(err);
    }
  }

  
  var panelUser = null;
  function openUserPanel(u){
    panelUser = u;
    var panel = document.getElementById('adminActionPanel');
    if(!panel) return;
    panel.hidden = false;
    document.getElementById('aapTitle').textContent = 'Manage ' + (u.displayName || u.username || 'User');
    document.getElementById('aapUser').textContent = '@' + (u.username||'');
    document.getElementById('aapRc').textContent = fmt(u.balance);
    document.getElementById('aapBc').textContent = fmt(u.bloxCoins||0);
    document.getElementById('aapWager').textContent = fmt(u.totalWagered||0);
    document.getElementById('aapRank').textContent = u.rank || '—';
  }
  document.getElementById('aapClose').addEventListener('click', function(){ document.getElementById('adminActionPanel').hidden = true; });

  async function panelBalance(action){
    if(!panelUser) return;
    var cur = document.getElementById('aapCurrency').value || 'rc';
    var amount = parseInt(document.getElementById('aapAmount').value, 10);
    if(!Number.isFinite(amount)||amount<0){ Toast.error('Invalid','Amount'); return; }
    var r = await Auth.api('/admin/users/'+panelUser.id+'/balance', {
      method:'POST', body: JSON.stringify({ action: action, amount: amount, currency: cur })
    });
    if(r.ok){ Toast.success('Saved','Balance updated'); document.getElementById('adminActionPanel').hidden = true; loadUsers(document.getElementById('userSearch').value.trim()); loadStats(); }
    else Toast.error('Failed','Rejected');
  }
  document.getElementById('aapAdd').addEventListener('click', function(){ panelBalance('add'); });
  document.getElementById('aapSet').addEventListener('click', function(){ panelBalance('set'); });
  document.getElementById('aapTempBan').addEventListener('click', function(){ if(panelUser) handleAct('tempban', panelUser); });
  document.getElementById('aapBan').addEventListener('click', function(){ if(panelUser) handleAct('ban', panelUser); });
  document.getElementById('aapUnban').addEventListener('click', function(){ if(panelUser) handleAct('unban', panelUser); });
  document.getElementById('aapAdmin').addEventListener('click', function(){ if(panelUser) handleAct('admin', panelUser); });
  document.getElementById('aapResetLb').addEventListener('click', async function(){
    if(!panelUser) return;
    if(!confirm('Remove this player from leaderboard (reset wagered)?')) return;
    var r = await Auth.api('/admin/users/'+panelUser.id+'/reset-wagered', { method:'POST', body:'{}' });
    if(r.ok){ Toast.success('Removed','Leaderboard wagered reset'); loadUsers(document.getElementById('userSearch').value.trim()); }
    else Toast.error('Failed','Could not reset');
  });

  async function handleAct(act, u){
    var id = u.id;
    if(act === 'admin'){
      if(!confirm(u.isAdmin?'Revoke admin?':'Grant admin?')) return;
      var r = await Auth.api('/admin/users/'+id+'/admin', { method:'POST', body: JSON.stringify({ isAdmin: !u.isAdmin }) });
      if(r.ok){ Toast.success('Saved','Updated'); loadUsers(document.getElementById('userSearch').value.trim()); }
      else Toast.error('Failed','Could not update');
      return;
    }
    if(act === 'ban'){
      var reason = prompt('Ban reason:') || 'Banned by admin';
      if(!confirm('Permanent ban?')) return;
      var r = await Auth.api('/admin/users/'+id+'/ban', { method:'POST', body: JSON.stringify({ permanent:true, reason:reason }) });
      if(r.ok){ Toast.success('Banned','Done'); loadUsers(document.getElementById('userSearch').value.trim()); }
      else Toast.error('Failed','Ban rejected');
      return;
    }
    if(act === 'tempban'){
      var hours = prompt('Hours:', '24');
      if(hours==null) return;
      hours = parseInt(hours,10);
      if(!Number.isFinite(hours)||hours<1){ Toast.error('Invalid','Hours >= 1'); return; }
      var reason = prompt('Reason:') || 'Temp ban';
      var r = await Auth.api('/admin/users/'+id+'/ban', { method:'POST', body: JSON.stringify({ permanent:false, hours:hours, reason:reason }) });
      if(r.ok){ Toast.success('Temp banned', hours+'h'); loadUsers(document.getElementById('userSearch').value.trim()); }
      else Toast.error('Failed','Rejected');
      return;
    }
    if(act === 'unban'){
      if(!confirm('Unban?')) return;
      var r = await Auth.api('/admin/users/'+id+'/unban', { method:'POST', body:'{}' });
      if(r.ok){ Toast.success('Unbanned','Done'); loadUsers(document.getElementById('userSearch').value.trim()); }
      else Toast.error('Failed','Rejected');
      return;
    }
    var cur = prompt('Currency: rc or bc (BloxCoins)', 'rc');
    if(cur==null) return;
    cur = String(cur).toLowerCase().trim();
    if(cur !== 'bc' && cur !== 'blox' && cur !== 'bloxcoins') cur = 'rc';
    var amount = prompt(act==='add' ? ('Add '+(cur==='rc'?'RC':'BC')) : ('Set '+(cur==='rc'?'RC':'BC')+' to'));
    if(amount==null) return;
    amount = parseInt(amount,10);
    if(!Number.isFinite(amount)||amount<0){ Toast.error('Invalid','Need non-negative integer'); return; }
    var r = await Auth.api('/admin/users/'+id+'/balance', {
      method:'POST', body: JSON.stringify({ action: act==='add'?'add':'set', amount: amount, currency: cur })
    });
    if(r.ok){ Toast.success('Balance updated','Saved'); loadUsers(document.getElementById('userSearch').value.trim()); loadStats(); }
    else Toast.error('Failed','Rejected');
  }

  async function loadChat(){
    var el = document.getElementById('chatTable');
    try {
      var res = await Auth.api('/admin/chat?limit=50');
      if(!res.ok){ el.innerHTML = '<div class="av3-empty">Could not load chat</div>'; return; }
      var d = await res.json();
      var rows = d.messages || d.chat || [];
      if(!rows.length){ el.innerHTML = '<div class="av3-empty">No messages</div>'; return; }
      el.innerHTML = '<table class="av3-table"><tr><th>User</th><th>Message</th><th>When</th></tr>' +
        rows.map(function(m){
          return '<tr><td>@'+esc(m.username||m.user||'')+'</td><td>'+esc(m.message||m.text||'')+'</td><td>'+ago(m.created_at||m.createdAt)+'</td></tr>';
        }).join('') + '</table>';
    } catch(e){ el.innerHTML = '<div class="av3-empty">Error</div>'; }
  }

  async function loadLogs(){
    var el = document.getElementById('logsTable');
    try {
      var res = await Auth.api('/admin/logs');
      if(!res.ok){ el.innerHTML = '<div class="av3-empty">Could not load logs</div>'; return; }
      var d = await res.json();
      var rows = d.logs || [];
      if(!rows.length){ el.innerHTML = '<div class="av3-empty">No audit events yet</div>'; return; }
      el.innerHTML = '<table class="av3-table"><tr><th>When</th><th>Admin</th><th>Action</th><th>Target</th></tr>' +
        rows.map(function(l){
          return '<tr><td>'+ago(l.createdAt||l.created_at)+'</td><td>'+esc(l.adminUsername||'')+'</td><td>'+esc(l.action)+'</td><td>'+esc(l.targetUsername||l.targetId||'')+'</td></tr>';
        }).join('') + '</table>';
    } catch(e){ el.innerHTML = '<div class="av3-empty">Error</div>'; }
  }

  document.getElementById('userSearchBtn').addEventListener('click', function(){
    loadUsers(document.getElementById('userSearch').value.trim());
  });
  document.getElementById('userSearch').addEventListener('keydown', function(e){
    if(e.key==='Enter') loadUsers(e.target.value.trim());
  });
  document.getElementById('btnRefresh').addEventListener('click', function(){
    loadStats();
    loadUsers(document.getElementById('userSearch').value.trim());
  });

  loadStats();
  loadUsers('');
})();
</script>
</body>
</html>
