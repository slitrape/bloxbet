<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  #allGames{
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:1rem;
  }
  #allGames .card{
    padding:1.35rem;
    gap:.85rem;
  }
  #allGames .card-art{
    height:140px;
    margin-bottom:.35rem;
  }
  #allGames .card-art .ico,
  #allGames .card-art img.ico{
    width:72px;
    height:72px;
  }
  #allGames .card-title{
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:-.01em;
  }
  #allGames .card-desc{
    font-size:.85rem;
    line-height:1.55;
  }
  #allGames .card-foot{
    margin-top:.35rem;
    padding-top:.6rem;
    border-top:1px solid var(--border);
  }
  #allGames .card-meta{
    font-size:.78rem;
  }
  #allGames .btn-sm{
    padding:.5rem .9rem;
    font-size:.82rem;
  }
  #allGames .badge{
    font-size:.68rem;
    padding:.2rem .5rem;
  }
  #allGames .card.unavailable{
    opacity:.55;
    cursor:not-allowed;
  }
  #allGames .card.unavailable:hover{
    transform:none;
    border-color:var(--border);
    background:var(--surface);
  }

  @media (max-width:900px){
    #allGames{
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    }
  }
  @media (max-width:640px){
    #allGames{
      grid-template-columns:1fr;
      gap:.75rem;
    }
    #allGames .card-art{
      height:120px;
    }
    #allGames .card-art .ico,
    #allGames .card-art img.ico{
      width:56px;
      height:56px;
    }
    #allGames .card-title{font-size:.95rem}
    #allGames .card-desc{font-size:.8rem}

<script>
  (function(){
    var loader = document.getElementById('bbLoader');
    if(!loader) return;
    setTimeout(function(){
      loader.classList.add('hide');
      setTimeout(function(){ loader.remove(); }, 320);
    }, 2000);
  })();
</script>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/toasts.js"></script>
<script src="js/modals.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/deposit.js"></script>
<script src="js/admin-link.js"></script>
<script>
  (function(){
    if(typeof Auth === 'undefined'){ console.error('[games] Auth missing'); return; }
    if(!Auth.isLoggedIn()){ Auth.safeRedirect('login'); return; }

    var me = Auth.getUser();
    var navAvatar = document.getElementById('navAvatar');
    if(navAvatar && typeof renderAvatar === 'function') renderAvatar(navAvatar, me);

    var sub = document.getElementById('gamesSub');
    var grid = document.getElementById('allGames');

    var gamesList = [];
    var currentFilter = 'all';

    async function loadGames(){
      try {
        var res = await Auth.api('/games');
        if(!res.ok) throw new Error('bad status');
        var data = await res.json();
        gamesList = data.games || [];
        if(sub){
          var available = gamesList.filter(function(g){ return g.available; }).length;
          sub.textContent = available + ' game' + (available === 1 ? '' : 's') + ' available';
        }
        renderGames();
      } catch(e){
        grid.innerHTML =
          '<div class="empty" style="grid-column:1/-1">' +
            '<div class="icon"><img src="icons/search.png" alt="" class="ico" draggable="false"></div>' +
            '<h4>Could not load games</h4>' +
            '<p>Check that the server is running.</p>' +
          '</div>';
      }
    }

    function filterGames(){
      if(currentFilter === 'all') return gamesList;
      if(currentFilter === 'popular') return gamesList.filter(function(g){ return g.badge === 'popular'; });
      if(currentFilter === 'available') return gamesList.filter(function(g){ return g.available; });
      return gamesList;
    }

    function renderGames(){
      grid.innerHTML = '';
      var list = filterGames();

      if(list.length === 0){
        grid.innerHTML =
          '<div class="empty" style="grid-column:1/-1">' +
            '<div class="icon"><img src="icons/search.png" alt="" class="ico" draggable="false"></div>' +
            '<h4>No games found</h4>' +
            '<p>Try a different filter.</p>' +
          '</div>';
        return;
      }

      list.forEach(function(g){
        var card = document.createElement('div');
        card.className = 'card';
        if(!g.available) card.classList.add('unavailable');

        var playersLabel = g.players > 0
          ? g.players.toLocaleString() + ' playing'
          : 'No players';

        var badgeHtml = g.badge
          ? '<span class="badge badge-' + g.badge + '">' + g.badge + '</span>'
          : '';

        var buttonLabel = g.available ? 'Play' : 'Soon';
        var buttonClass = g.available ? 'btn-primary' : 'btn-ghost';

        card.innerHTML =
          '<div class="card-art">' + Icon(g.icon, 'ico-2xl') + '</div>' +
          '<div class="card-head">' +
            '<div class="card-title">' + g.name + '</div>' +
            badgeHtml +
          '</div>' +
          '<div class="card-desc">' + g.desc + '</div>' +
          '<div class="card-foot">' +
            '<div class="card-meta">' +
              (g.players > 0 ? '<span class="live-dot"></span>' : '') +
              playersLabel +
            '</div>' +
            '<button class="btn ' + buttonClass + ' btn-sm" ' + (g.available ? '' : 'disabled') + '>' + buttonLabel + '</button>' +
          '</div>';

        card.addEventListener('click', function(){
          if(!g.available){
            Toast.info(g.name, 'Coming soon.');
            return;
          }
          if(g.route) location.href = g.route;
        });

        grid.appendChild(card);
      });
    }

    document.querySelectorAll('#filterBar button').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.querySelectorAll('#filterBar button').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderGames();
      });
    });

    loadGames();

    // Refresh counts every 15s so "X playing" stays honest
    setInterval(loadGames, 15000);
  })();
</script>
